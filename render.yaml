services:
  - type: web
    name: product-admin-test
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: product-admin-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: product-admin-db
    plan: free
    databaseName: product_admin
    user: product_admin
